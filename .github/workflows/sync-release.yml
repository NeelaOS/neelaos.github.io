name: Sync latest NeelaOS release

on:
  schedule:
    - cron: "17 * * * *"          # hourly check
  workflow_dispatch:              # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [neelaos-release]      # instant trigger from NeelaOS/NeelaOS (see README)

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest release into data/site.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-release.mjs

      - name: Rebuild site
        run: node build.mjs

      - name: Commit if anything changed
        run: |
          # build.mjs stamps today's date into sitemap/llms files; only publish when the release data changed
          if git diff --quiet -- data/site.json; then
            echo "Release unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync latest NeelaOS release"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
        id: commit

      # Pushes made with GITHUB_TOKEN don't always start a Pages build, so ask for one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (it may still build from the push)."
